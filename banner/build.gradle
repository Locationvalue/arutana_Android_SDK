plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'io.dearone.arutana.sample.banner'
    compileSdk 34

    buildFeatures {
        viewBinding true
    }
    
    defaultConfig {
        applicationId "io.dearone.arutana.sample.banner"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation files('../libs/arutana-latest.aar')
    // Fluct メディエーション: Arutana の広告がない枠で Fluct の広告を表示する
    implementation files('../libs/arutana-fluct-adapter-0.0.1.aar')
    implementation 'jp.fluct:FluctSDK:9.17.1'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    //内部ブラウザ表示に必要
    implementation libs.browser
}